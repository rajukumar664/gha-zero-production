name: sample CI
on: 
  workflow_dispatch: 
    inputs:
      deployment_target: 
       description: "chose a demo target"
       required: true
       type: choice
       options:
         - staging
         - production
permissions: 
  contents: read
env:
  APP_NAME: sample_app
concurrency: 
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sample_ci_pipline:
    env:
      APP_NAME: JOB_Level
    runs-on: ubuntu-latest
    steps:
      - name: This is demo pipline
        run: echo "checking $APP_NAME"
  
